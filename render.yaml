# Render Blueprint for Éternelle Wedding SaaS
# Deploys Full-Stack Web Service (Express + React) & PostgreSQL Database

services:
  # 1. Full-Stack Web Service
  - type: web
    name: eternelle-wedding-saas
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eternelle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  # 2. Managed PostgreSQL Database
  - name: eternelle-db
    plan: free
    databaseName: eternelle_db
    user: eternelle_user
