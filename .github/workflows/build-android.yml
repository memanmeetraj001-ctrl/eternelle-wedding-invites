name: Build Android Release (.aab & .apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab) and APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Android App Bundle (.aab) - For Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: eternelle-playstore-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Android APK (.apk) - For Direct Testing
        uses: actions/upload-artifact@v4
        with:
          name: eternelle-direct-install-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
